name: golf_live_scoring
description: "Golf live scoring project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  auto_route: ^11.2.0
  bloc: ^9.2.1
  cached_network_image: ^4.0.6
  cloud_firestore: ^7.1.0
  collection: ^1.19.1
  equatable: ^3.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_multi_formatter: ^2.13.11
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  rxdart: ^0.28.0
  uuid: ^4.6.0
  widgets_easier: ^1.0.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat_thin.ttf
          weight: 100
        - asset: assets/fonts/montserrat_extralight.ttf
          weight: 200
        - asset: assets/fonts/montserrat_light.ttf
          weight: 300
        - asset: assets/fonts/montserrat_regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat_medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat_semibold.ttf
          weight: 600
        - asset: assets/fonts/montserrat_bold.ttf
          weight: 700

flutter_gen:
  output: lib/ui/gen/
  line_length: 100

  integrations:
    image: false


flutter_intl:
  enabled: true
  class_name: GolfLocalizations
  main_locale: en
  arb_dir: assets/l10n
  output_dir: lib/ui/gen
  output-localization-file: app_localizations.dart